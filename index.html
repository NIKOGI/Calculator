<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="displayHolder">
    <div class="display">
    
    </div>
    </div>

    <div class="buttonHolder">

    <div class="numHolder">
        <button class="num">0</button>
        <button class="num">1</button>
        <button class="num">2</button>
        <button class="num">3</button>
        <button class="num">4</button>
        <button class="num">5</button>
        <button class="num">6</button>
        <button class="num">7</button>
        <button class="num">8</button>
        <button class="num">9</button>
    </div>

    <div class="operatorHolder">
        <button class = "operator">*</button>
        <button class = "operator">/</button>
        <button class = "operator">+</button>
        <button class = "operator">-</button>
        <button class = "operator">=</button>
        <button class = "operator">clear</button>
    </div>

    </div>
</div>
<script>

let buttons = document.querySelectorAll("button");
let display = document.querySelector(".display");
let num1Check = false;
let num2Check = false;
let num1 = "";
let num2 = ""; 
let operator = "";


const add = function(num1, num2) {
  return num1 + num2;
};

const subtract = function(num1, num2) {
  return num1 - num2;	
};

const multiply = function(num1, num2) {
  return num1 * num2;
};

const divide = function (num1, num2)
{
    return num1 / num2;
}

function operate(num1, num2, operator)
{
if(operator === "*")
{
    return multiply(num1, num2);
}
else if(operator === "/")
{
    return divide(num1, num2);
}
else if(operator === "+")
{
    return add(num1, num2);
}
else if(operator === "-")
{
    return subtract(num1, num2);
}
}

buttons.forEach((button) =>
{
    button.addEventListener("click", () => {
    if(button.textContent === "=" && num2 === "" && num1Check && operator !== "")
    {
        let answer = operate(parseInt(num1), parseInt(num1), operator);
        display.innerText = answer;
        console.log("pressed2")
        num1 = answer;
        num2 = "";
        operator = "";
        num2Check = true;
        console.log(num1Check);
        console.log(num2Check);
    }
    else if(button.textContent === "=" && num1Check && !num2Check)
    {
        let answer = operate(parseInt(num1), parseInt(num2), operator);
        display.innerText = answer;
        num1 = answer;
        num2 = "";
        operator = "";
        num2Check = true;
        console.log("pressed");
    }
    else if(button.textContent !== "*" && button.textContent !== "+" && button.textContent !== "-" && button.textContent !== "/"  && button.textContent !== "=" && !num1Check)
    {
        display.innerText += button.innerText;
        num1 += button.innerText;
    }
    else if(button.textContent === "*" || button.textContent === "+" || button.textContent === "-" || button.textContent === "/")
    {
        display.innerText += button.innerText;
        operator += button.innerText;
        num1Check = true;
        num2Check = false;
    }
    else if(button.textContent !== "=" && !num2Check && num1)
    {
        display.innerText += button.innerText;
        num2 += button.innerText;
    }
   
    })
})


</script>
</body>
</html>
